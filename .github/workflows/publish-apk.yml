name: Publish APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK integrity and checksum
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          CHECKSUM_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH not found" >&2
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty" >&2
            exit 1
          fi

          if [ ! -f "$CHECKSUM_PATH" ]; then
            echo "Error: $CHECKSUM_PATH not found" >&2
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          echo "Verifying ZIP archive structure..."
          unzip -tq "$APK_PATH"

          echo "APK validation successful."

      - name: Create GitHub Release and Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build ${{ github.run_number }}.${{ github.run_attempt }}"
          APK_PATH="apk-distribution/app-debug.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_BYTES=$(stat -c%s "$APK_PATH")
          SHA256_HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          DIRECT_DOWNLOAD_URL="https://github.com/${REPO}/releases/latest/download/app-debug.apk"

          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Android Debug APK built in Google AI Studio.

          **File:** app-debug.apk
          **Size:** $APK_SIZE ($APK_BYTES bytes)
          **SHA-256:** \`$SHA256_HASH\`
          **Direct Download:** [Download app-debug.apk]($DIRECT_DOWNLOAD_URL)" \
            --latest

          echo "### Release Published Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** $APK_SIZE ($APK_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`$SHA256_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page:** [$TAG_NAME]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download:** [Download app-debug.apk]($DIRECT_DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY

          echo "Release tag: $TAG_NAME"
          echo "APK size: $APK_SIZE ($APK_BYTES bytes)"
          echo "SHA-256: $SHA256_HASH"
          echo "Release page: $RELEASE_URL"
          echo "Direct download URL: $DIRECT_DOWNLOAD_URL"
